name: Deploy Mirab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm run check

      - name: Build
        run: pnpm run build
        env:
          GITHUB_ACTIONS: true

      - name: Publish dist to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/mirab-gh-pages
          git fetch origin gh-pages:gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/mirab-gh-pages gh-pages
          else
            git worktree add --orphan -b gh-pages /tmp/mirab-gh-pages
          fi
          find /tmp/mirab-gh-pages -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R dist/. /tmp/mirab-gh-pages/
          touch /tmp/mirab-gh-pages/.nojekyll
          cd /tmp/mirab-gh-pages
          git add --all
          git commit -m "نشر مِرآب على GitHub Pages" || true
          git push origin gh-pages
